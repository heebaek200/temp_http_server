<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Portfolio Dashboard</title>

  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./css/power.css">
  <link rel="stylesheet" href="./css/profile.css">
  <link rel="stylesheet" href="./css/panels.css">
</head>
<body>
  <div id="app">
    <!-- A 담당 시작 -->
    <section id="power-screen" class="power">
      <!-- 전원 화면 -->
       전원 화면
    </section>
    <!-- A 담당 끝 -->

    <main id="dashboard" class="dashboard hidden">
      <!-- B 담당 시작 -->
      <aside id="profile" class="profile">
        <!-- 프로필 영역 -->
        프로필 영역
      </aside>
      <!-- B 담당 끝 -->

      <!-- C 담당 시작 -->
      <section id="panels" class="panels" aria-labelledby="panels-title">
        <!-- 왼쪽 영역 -->
        <div class="panel-column panel-column--left">
          <!-- 위쪽 가로형 패널 -->
          <article class="panel-card panel-card--top" data-panel="top">
            <div class="panel-door panel-door--left"></div>
            <div class="panel-door panel-door--right"></div>

            <button
              type="button"
              class="panel-info-button"
              aria-label="위쪽 패널 안내"
            >
              ⓘ
            </button>

            <button
              type="button"
              class="panel-lock-button"
              aria-label="위쪽 패널 잠김"
              aria-disabled="true"
            >
              🔒︎
            </button>

            <div class="panel-content" hidden>
              <!-- 잠금 해제 후 콘텐츠 영역 -->
            </div>
          </article>

          <!-- 가운데 큰 가로형 패널 -->
          <article class="panel-card panel-card--main" data-panel="main">
            <div class="panel-door panel-door--left"></div>
            <div class="panel-door panel-door--right"></div>

            <button
              type="button"
              class="panel-info-button"
              aria-label="가운데 패널 안내"
            >
              ⓘ
            </button>

            <button
              type="button"
              class="panel-lock-button"
              aria-label="가운데 패널 잠김"
              aria-disabled="true"
            >
              🔒︎
            </button>

            <div class="panel-content" hidden>
              <!-- 잠금 해제 후 콘텐츠 영역 -->
            </div>
          </article>

          <!-- 아래쪽 패널 묶음 -->
          <div class="panel-row">
            <article class="panel-card panel-card--small" data-panel="small-left">
              <div class="panel-door panel-door--left"></div>
              <div class="panel-door panel-door--right"></div>

              <button
                type="button"
                class="panel-info-button"
                aria-label="아래쪽 왼쪽 패널 안내"
              >
                ⓘ
              </button>

              <button
                type="button"
                class="panel-lock-button"
                aria-label="아래쪽 왼쪽 패널 잠김"
                aria-disabled="true"
              >
                🔒︎
              </button>

              <div class="panel-content" hidden>
                <!-- 잠금 해제 후 콘텐츠 영역 -->
              </div>
            </article>

            <article class="panel-card panel-card--small" data-panel="small-right">
              <div class="panel-door panel-door--left"></div>
              <div class="panel-door panel-door--right"></div>

              <button
                type="button"
                class="panel-info-button"
                aria-label="아래쪽 오른쪽 패널 안내"
              >
                ⓘ
              </button>

              <button
                type="button"
                class="panel-lock-button"
                aria-label="아래쪽 오른쪽 패널 잠김"
                aria-disabled="true"
              >
                🔒︎
              </button>

              <div class="panel-content" hidden>
                <!-- 잠금 해제 후 콘텐츠 영역 -->
              </div>
            </article>
          </div>
        </div>

        <!-- 오른쪽 영역 -->
        <div class="panel-column panel-column--right">
          <article class="panel-card panel-card--tall" data-panel="tall">
            <div class="panel-door panel-door--left"></div>
            <div class="panel-door panel-door--right"></div>

            <button
              type="button"
              class="panel-info-button"
              aria-label="오른쪽 세로형 패널 안내"
            >
              ⓘ
            </button>

            <button
              type="button"
              class="panel-lock-button"
              aria-label="오른쪽 세로형 패널 잠김"
              aria-disabled="true"
            >
              🔒︎
            </button>

            <div class="panel-content" hidden>
              <!-- 잠금 해제 후 콘텐츠 영역 -->
            </div>
          </article>
        </div>
      </section>
    </main>
  </div>

  <script src="./js/app.js"></script>
  <script src="./js/power.js"></script>
  <script src="./js/profile.js"></script>
  <script src="./js/panels.js"></script>
</body>
</html>
