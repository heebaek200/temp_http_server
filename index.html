<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Portfolio Dashboard</title>

  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./css/power.css">
  <link rel="stylesheet" href="./css/profile.css">
  <link rel="stylesheet" href="./css/panels.css">
</head>
<body>
  <div id="app">
    <!-- A 담당 시작 -->
    <section id="power-screen" class="power">
      <!-- 기계 위쪽 케이블 및 노란색 연결부 -->
       <div class="power-cable">
        <div class="power-cable-line">파워선 </div>
        <div class="power-cable-connector">파워선 노란색 연결부</div>
       </div>
      <!-- 전원 화면 -->
       <!-- 기계 본체 -->
       <div class="power-machine">
        <!-- 기계 스크린 -->
        <div class="power-screen">
          <h2 class="power-screen-title">I'm Pierre-Louis</h2>
          <p class="power-screen-desc">
        I'm a creative freelancer based in France. Welcome on my personal dashboard.
          </p>
        </div>
        <!-- 너트 4개(상단 2) -->
        <div class="power-nut-up">
          <div class="power-screw"></div>
          <div class="power-screw"></div>
        </div>
        <!-- 너트 4개(하단 2) -->
        <div class="power-nut-down">
          <div class="power-screw"></div>
          <div class="power-screw"></div>
        </div>
        <!-- 말 풍선 -->
         <div class="power-speech-bubble"></div>
        <!-- 기계 버튼 -->
        <div class="power-button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round">
            <path d="M17.5 7.5a8.5 8.5 0 1 1-11 0"></path>
            <line x1="12" y1="3" x2="12" y2="12"></line>
          </svg>
        </div>
        <!-- 기계 버튼 밑 어두운 원 -->
         <div class="power-circle">어두운 원</div>
         <div class="power-sound-guide">
          <p class="power-sound-guide-sentence">TURN ON YOUR</p>

          <div class="power-sound-guide-icon">
            <svg viewBox="0 0 24 24" fill="currentColor" width="16" height="16">
            <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
        </svg>
          </div>
         </div>
       </div>
       전원 화면
    </section>
    <!-- A 담당 끝 -->

    <main id="dashboard" class="dashboard hidden">
      <!-- B 담당 시작 -->
      <aside id="profile" class="profile">
       <!-- 헤더: 이름 + 로고 아이콘 -->
       <div class="profile-header">
          <div class="profile-header-box">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" height="1.55em" viewBox="0 0 35 24" width="2.39em"><g fill="CurrentColor"><rect height="6.67978" rx="3.33989" transform="matrix(0 1 -1 0 7.546878 -5.812502)" width="22.2659" x="6.67969" y=".867188"></rect><rect height="6.67978" rx="3.33989" transform="matrix(0 1 -1 0 16.812488 -15.078112)" width="13.1369" x="15.9453" y=".867188"></rect><rect height="6.67978" rx="3.33989" transform="matrix(0 1 -1 0 26.078088 -24.343712)" width="22.2659" x="25.2109" y=".867188"></rect><rect height="6.67978" rx="3.33989" transform="matrix(0 1 -1 0 44.47269 -24.48051)" width="13.1369" x="34.4766" y="9.99609"></rect></g></svg>
            <h2>PIERRE-LOUIS LABONNE</h2>
          </div>
          <img class="profile-header-img" src="https://cdn.prod.website-files.com/61ba0d8d68d959d09b491aa4/632c8d7e710706a7d835765a_device-dots.png" alt="" >
       </div>
       <!-- 스크린: 캐릭터 이미지 + CONTACT ME 클릭 시 뜨는 팝업 -->
       <div class="profile-screen">
        <img class="profile-screen-img" src="assets\images\b-3.png" alt="">
           <p  class="profile-screen-popup">SLIDE IT!</p>
       </div>
       <!-- CONTACT ME 버튼 -->
       <div class="profile-contact-button">
          <button>CONTACT ME</button>
          <div class="profile-contact-img-box"><span class="profile-contact-img"></span>
          </div>
       </div>
       <!-- Face customizer: 안내 문구 + 스위치 목록 -->
       <div class="profile-customizer">
        <div class="profile-customizer-header">
          <div class="profile-customizer-header-box">
            <span class="profile-customizer-img"></span>
           <p>Face customizer</p>
          </div>
           <p class="profile-customizer-bar"></p>
        </div>
          <!-- 스위치 항목: 좌우 이동 버튼 + 라벨 텍스트 + 오른쪽 꾸밈용 점 -->
          <div class="profile-switch-button-layout">
          <div class="profile-switch-button">
            <div class="profile-switch">
              <p class="profile-switch-thumb"></p>
            </div>
            <p class="profile-button-label">GRAPHIC & WEBDESIGNER</p>
            <div class="profile-switch-deco">
              <p class="profile-switch-dot "></p>
              <p class="profile-switch-dot "></p>
            </div>
          </div>
          <div class="profile-switch-button">
            <div class="profile-switch">
              <p class="profile-switch-thumb"></p>
            </div>
            <p class="profile-button-label">MOTION DESIGNER</p>
            <div class="profile-switch-deco">
              <p class="profile-switch-dot "></p>
              <p class="profile-switch-dot "></p>
            </div>
          </div>
          <div class="profile-switch-button profile-switch-button-end">
            <div class="profile-switch">
              <p class="profile-switch-thumb"></p>
            </div>
            <p class="profile-button-label">WEBFLOW EXPERT</p>
            <div class="profile-switch-deco">
              <p class="profile-switch-dot "></p>
              <p class="profile-switch-dot "></p>
            </div>
            </div>
          </div>
       </div>
       <p class="profile-black-bar"></p>
      </aside>
      <!-- B 담당 끝 -->

      <!-- C 담당 시작 -->
      <section id="panels" class="panels" aria-labelledby="panels-title">
        <!-- 왼쪽 영역 -->
        <div class="panel-column panel-column--left">
          <!-- 위쪽 가로형 패널 -->
          <article class="panel-card panel-card--top" data-panel="top">
            <div class="panel-door panel-door--left"></div>
            <div class="panel-door panel-door--right"></div>

            <button
              type="button"
              class="panel-info-button"
              aria-label="위쪽 패널 안내"
            >
              ⓘ
            </button>

            <button
              type="button"
              class="panel-lock-button"
              aria-label="위쪽 패널 잠김"
              aria-disabled="true"
            >
              🔒︎
            </button>

            <div class="panel-content" hidden>
              <!-- 잠금 해제 후 콘텐츠 영역 -->
            </div>
          </article>

          <!-- 가운데 큰 가로형 패널 -->
          <article class="panel-card panel-card--main" data-panel="main">
            <div class="panel-door panel-door--left"></div>
            <div class="panel-door panel-door--right"></div>

            <button
              type="button"
              class="panel-info-button"
              aria-label="가운데 패널 안내"
            >
              ⓘ
            </button>

            <button
              type="button"
              class="panel-lock-button"
              aria-label="가운데 패널 잠김"
              aria-disabled="true"
            >
              🔒︎
            </button>

            <div class="panel-content" hidden>
              <!-- 잠금 해제 후 콘텐츠 영역 -->
            </div>
          </article>

          <!-- 아래쪽 패널 묶음 -->
          <div class="panel-row">
            <article class="panel-card panel-card--small" data-panel="small-left">
              <div class="panel-door panel-door--left"></div>
              <div class="panel-door panel-door--right"></div>

              <button
                type="button"
                class="panel-info-button"
                aria-label="아래쪽 왼쪽 패널 안내"
              >
                ⓘ
              </button>

              <button
                type="button"
                class="panel-lock-button"
                aria-label="아래쪽 왼쪽 패널 잠김"
                aria-disabled="true"
              >
                🔒︎
              </button>

              <div class="panel-content" hidden>
                <!-- 잠금 해제 후 콘텐츠 영역 -->
              </div>
            </article>

            <article class="panel-card panel-card--small" data-panel="small-right">
              <div class="panel-door panel-door--left"></div>
              <div class="panel-door panel-door--right"></div>

              <button
                type="button"
                class="panel-info-button"
                aria-label="아래쪽 오른쪽 패널 안내"
              >
                ⓘ
              </button>

              <button
                type="button"
                class="panel-lock-button"
                aria-label="아래쪽 오른쪽 패널 잠김"
                aria-disabled="true"
              >
                🔒︎
              </button>

              <div class="panel-content" hidden>
                <!-- 잠금 해제 후 콘텐츠 영역 -->
              </div>
            </article>
          </div>
        </div>

        <!-- 오른쪽 영역 -->
        <div class="panel-column panel-column--right">
          <article class="panel-card panel-card--tall" data-panel="tall">
            <div class="panel-door panel-door--left"></div>
            <div class="panel-door panel-door--right"></div>

            <button
              type="button"
              class="panel-info-button"
              aria-label="오른쪽 세로형 패널 안내"
            >
              ⓘ
            </button>

            <button
              type="button"
              class="panel-lock-button"
              aria-label="오른쪽 세로형 패널 잠김"
              aria-disabled="true"
            >
              🔒︎
            </button>

            <div class="panel-content" hidden>
              <!-- 잠금 해제 후 콘텐츠 영역 -->
            </div>
          </article>
        </div>
      </section>
    </main>
  </div>

  <script src="./js/app.js"></script>
  <script src="./js/power.js"></script>
  <script src="./js/profile.js"></script>
  <script src="./js/panels.js"></script>
</body>
</html>
